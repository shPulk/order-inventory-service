spring:
  datasource:
    url: jdbc:h2:file:./data/oims;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

oims:
  reservation:
    strategy: pessimistic
    ttl-minutes: 15
    max-attempts: 5
    expiry-check-ms: 30000

  security:
   jwt-secret: ${OIMS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
   dev-tokens: true