components:
  schemas:
    AdjustStockRequest:
      type: object
      properties:
        onHand:
          type: integer
          format: int32
          minimum: 0
    StockView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        onHand:
          type: integer
          format: int32
        reserved:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
    CreateProductRequest:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 255
          minLength: 0
        price:
          type: number
          minimum: 0.00
      required:
      - name
      - price
      - sku
    ProductView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        price:
          type: number
    Line:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
      required:
      - productId
    PlaceOrderBody:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
          maxItems: 50
          minItems: 0
      required:
      - lines
    LineView:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - RESERVED
          - PAID
          - SHIPPED
          - DELIVERED
          - CANCELLED
          - FAILED
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        total:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineView"
    StatusChangeRequest:
      type: object
      properties:
        target:
          type: string
          enum:
          - CREATED
          - RESERVED
          - PAID
          - SHIPPED
          - DELIVERED
          - CANCELLED
          - FAILED
      required:
      - target
    TokenRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - roles
      - subject
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        type:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    TopProductRow:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        units:
          type: integer
          format: int64
        revenue:
          type: number
        orders:
          type: integer
          format: int64
    LowStockRow:
      type: object
      properties:
        warehouseCode:
          type: string
        warehouseName:
          type: string
        productId:
          type: integer
          format: int64
        sku:
          type: string
        productName:
          type: string
        onHand:
          type: integer
          format: int32
        reserved:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
