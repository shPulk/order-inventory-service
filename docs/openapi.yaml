        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StockView"
        "400":
          description: Validation failed (body has an errors map)
          content:
            application/problem+json:
              schema:
                type: object
        "401":
          description: "Missing, invalid or expired token"
          content:
            application/problem+json:
              schema:
                type: object
        "403":
          description: Authenticated but role not allowed
